<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dostęp - mObywatel</title>
    <!-- Biblioteka Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #101317;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .logo { width: 60px; margin-bottom: 20px; }
        h2 { font-size: 20px; margin-bottom: 8px; font-weight: 600; }
        p { font-size: 14px; color: #a0a0a0; margin-bottom: 24px; }
        input {
            width: 100%; padding: 14px; background: #1c2127;
            border: 1px solid #333; border-radius: 10px; color: white;
            font-size: 16px; text-align: center; outline: none; margin-bottom: 16px;
        }
        input:focus { border-color: #0052a5; }
        button {
            width: 100%; padding: 14px; background: #0052a5; color: white;
            border: none; border-radius: 10px; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #004080; }
        .error-msg { color: #ff4d4d; font-size: 14px; margin-top: 12px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="https://i.imgur.com/U7TRg0V.png" alt="Logo" class="logo">
        <h2>Wprowadź kod dostępu</h2>
        <p>Aby przejść do aplikacji, podaj ważny klucz dostępowy.</p>

        <form id="loginForm">
            <input type="password" id="passInput" placeholder="Wpisz kod..." required autocomplete="off">
            <button type="submit" id="submitBtn">Zaloguj się</button>
        </form>

        <div id="errorMsg" class="error-msg">Nieprawidłowy lub wygasły kod dostępu.</div>
    </div>

    <script>
        // 1. UZUPEŁNIJ SWOJE DANE Z SUPABASE:
    const SUPABASE_URL = "https://gurbwcazyzzbyvxrjfms.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_uPnLiu2lBxGDMtcdx2XxRg_PD0pA6_v";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Automatyczne sprawdzanie klucza z adresu URL (np. login.html?code=KOD)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codeFromUrl = urlParams.get('code');
            if (codeFromUrl) {
                document.getElementById('passInput').value = codeFromUrl;
                verifyAndRedirect(codeFromUrl);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const enteredPass = document.getElementById('passInput').value.trim();
            verifyAndRedirect(enteredPass);
        });

        async function verifyAndRedirect(code) {
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');
            errorMsg.style.display = 'none';
            submitBtn.textContent = "Sprawdzanie...";

            try {
                // Zapytanie do Supabase: czy istnieje aktywny klucz z dobrą datą
                const { data, error } = await supabaseClient
                    .from('access_keys')
                    .select('*')
                    .eq('key', code)
                    .eq('is_active', true)
                    .gt('expires_at', new Date().toISOString())
                    .single();

                if (data) {
                    // Kod jest poprawny – zapisujemy sesję i przechodzimy do karty
                    localStorage.setItem('app_access_granted', 'true');
                    window.location.href = "index.html"; // lub index.html / home.html
                } else {
                    errorMsg.style.display = 'block';
                    submitBtn.textContent = "Zaloguj się";
                }
            } catch (err) {
                console.error(err);
                errorMsg.style.display = 'block';
                submitBtn.textContent = "Zaloguj się";
            }
        }
    </script>
</body>
</html>
